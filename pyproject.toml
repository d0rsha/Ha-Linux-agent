[project]
name = "ha-linux-agent"
version = "0.4.0"
description = "Small self-hosted AI agent for Home Assistant over MCP"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "mcp[cli]>=2,<3",
  "openai>=1.0",
  "pydantic-settings>=2.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
ha-agent = "ha_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ha_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
