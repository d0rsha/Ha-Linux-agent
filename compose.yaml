services:
  ha-agent:
    build: .
    env_file:
      - .env
    restart: "no"
    network_mode: host
    stdin_open: true
    tty: true
    volumes:
      - ha-agent-data:/data

  ha-agent-telegram:
    build: .
    env_file:
      - .env
    command: ["telegram"]
    restart: unless-stopped
    network_mode: host
    profiles: ["telegram"]
    volumes:
      - ha-agent-data:/data

  ha-agent-host-mcp:
    build: .
    env_file:
      - .env
    command: ["host-mcp"]
    restart: unless-stopped
    network_mode: host
    pid: host
    profiles: ["host-mcp"]
    volumes:
      - ha-agent-data:/data

volumes:
  ha-agent-data:
