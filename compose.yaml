services:
  ha-agent:
    build: .
    env_file:
      - .env
    restart: "no"
    network_mode: host
    stdin_open: true
    tty: true
    volumes:
      - ha-agent-data:/data

  signal-api:
    image: bbernhard/signal-cli-rest-api:latest
    restart: unless-stopped
    profiles: ["signal"]
    environment:
      - MODE=native
    volumes:
      - signal-cli-data:/home/.local/share/signal-cli

  ha-agent-signal:
    build: .
    env_file:
      - .env
    command: ["signal"]
    restart: unless-stopped
    profiles: ["signal"]
    depends_on:
      - signal-api
    volumes:
      - ha-agent-data:/data

  ha-agent-host-mcp:
    build: .
    env_file:
      - .env
    command: ["host-mcp"]
    restart: unless-stopped
    network_mode: host
    pid: host
    profiles: ["host-mcp"]
    volumes:
      - ha-agent-data:/data

volumes:
  ha-agent-data:
  signal-cli-data:
